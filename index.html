<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Baukasten 3D – Klemmbausteine im Browser bauen</title>
  <meta name="description" content="Baukasten 3D: Modelle aus Klemmbausteinen direkt im Browser bauen – mit über 200 Teilen, Vorlagen, Bauanleitung und Stückliste. Ohne Anmeldung, alles bleibt auf deinem Gerät.">
  <meta name="theme-color" content="#111518">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:title" content="Baukasten 3D">
  <meta property="og:description" content="Modelle aus Klemmbausteinen direkt im Browser bauen.">
  <meta property="og:type" content="website">
  <link rel="preload" href="assets/fonts/dm-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-tool="build">
  <div class="app">
    <header id="topbar" class="topbar"></header>

    <aside id="panel-parts" class="panel sheet" aria-label="Teile">
      <div id="parts-head" class="phead"></div>
      <div id="parts-grid" class="parts"></div>
    </aside>

    <main class="stage">
      <div id="canvas" class="canvas"></div>
      <div id="viewbar" class="floating viewbar" aria-label="Ansicht"></div>
      <div id="level" class="floating level" title="Obere Ebenen ausblenden"></div>
      <div id="status" class="status" aria-live="polite"></div>
      <div id="selbar" class="floating selbar" role="toolbar" aria-label="Auswahl bearbeiten" hidden></div>
      <div id="toolbar" class="floating toolbar" role="toolbar" aria-label="Werkzeuge"></div>
      <div id="instr" class="floating instr" hidden></div>
      <div id="onboard" class="floating onboard" role="dialog" aria-label="Einführung" hidden></div>
      <noscript><p class="noscript">Baukasten 3D braucht JavaScript und WebGL.</p></noscript>
    </main>

    <aside id="panel-colors" class="panel sheet" aria-label="Farbe">
      <div id="colors" class="colors"></div>
      <div class="current-wrap">
        <span class="glabel">Aktuelles Teil</span>
        <div id="current"></div>
        <div id="plate-info" class="plate-info"></div>
      </div>
      <footer class="credit">
        <span>Alles bleibt in deinem Browser.</span>
        <span><a href="https://apps.mosaik-design.at/" target="_blank" rel="noopener">mosaik</a> · <a href="https://apps.mosaik-design.at/kontakt/#impressum" target="_blank" rel="noopener">Impressum</a></span>
      </footer>
    </aside>
  </div>
  <div id="sheet-backdrop" class="backdrop" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
